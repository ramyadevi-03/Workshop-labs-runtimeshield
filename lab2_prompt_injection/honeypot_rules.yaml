# Honeypot rules for threat detection
rules:
  - id: "HP-001"
    name: "Block System Config Access"
    description: "Triggers if the AI attempts to read internal infrastructure configuration."
    action: "read_file"
    resource_patterns:
      - ".*system_config\.yaml.*"
      - ".*\.env.*"
    enforcement: "DENY"
    fraud_score_increase: 50
